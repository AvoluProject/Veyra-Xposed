name: Build Veyra Settings 1.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android 37 platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate project metadata and source structure
        run: python tools/verify_static.py

      - name: Assemble signed premium APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Veyra-Settings-1.0.0.apk
          sha256sum dist/Veyra-Settings-1.0.0.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-Settings-1.0.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
